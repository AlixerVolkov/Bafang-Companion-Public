name: Android build and protocol tests (public source)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOL="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$TOOL"
          "$TOOL" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
      - name: Run core tests and compile public APK (not for upgrade)
        run: |
          gradle --no-daemon :core:test :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
